# Todo dia às 3h da manhã (Brasília) atualiza o "onde ver" de cada título e republica o site.
name: Atualizar streaming

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch: {}    # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar streamings no TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python atualizar_streaming.py
      - name: Salvar se mudou
        run: |
          git config user.name "quemovie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados.js
          git diff --cached --quiet || git commit -m "Atualiza onde ver ($(date +%F))"
          git push
